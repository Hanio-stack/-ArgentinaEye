name: Update ArgentinaEye data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * *" # 06:15 JST
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"

permissions:
  contents: write

concurrency:
  group: argentinaeye-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect data
        run: python scripts/update.py
      - name: Commit changed snapshots
        run: |
          git config user.name "ArgentinaEye Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh ArgentinaEye snapshot"
            git pull --rebase origin main
            git push
          fi
