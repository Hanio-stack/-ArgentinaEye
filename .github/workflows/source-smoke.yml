name: Live source smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  official-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect live data
        run: python scripts/update.py
      - name: Require official source health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('public/data/latest.json').read_text())
          required={'INDEC inflation','BCRA reserves','Fiscal balance','Vaca Muerta oil','RIGI','CAMMESA demand'}
          health={x['name']:x for x in data.get('source_health',[])}
          failed=[]
          for name in sorted(required):
              item=health.get(name)
              if not item or not item.get('ok'):
                  failed.append(f"{name}: {item.get('note') if item else 'missing health record'}")
          if failed:
              raise SystemExit('Official source smoke failed\n'+'\n'.join(failed))
          print('All required official sources passed')
          PY
